# =============================================================
# LINE AIオフィス 設定ファイル（office.conf）
# install.sh がこのファイルを読んで全社員を組み立てる。
# 顧客ごとにこのファイルだけ書き換えれば導入できる。
# =============================================================

# --- 基本パス ---
# オフィスの基準ディレクトリ（社員フォルダ・inbox・logs がここにできる）
OFFICE_HOME="$HOME/line-ai-office"

# Claude Code 実行バイナリのパス（環境により異なる）
#   確認方法: which claude
CLAUDE_BIN="/opt/homebrew/bin/claude"

# --- 動作モード（トークン消費に直結）---
# ★★ 商品は必ず push で出荷する。poll は使わない（禁止）。 ★★（2026-07-08 決定）
#   理由：poll は待機中も30秒ごとに Claude を起動し続け、顧客の利用枠を枯らして
#         「トークン切れで使えない」クレームの直接原因になる。過去に実機で発生・根絶済み。
#
# push : LINE着信時"だけ"AIが動く。受付係(leader-poll)を常駐させず、監視Cronも作らない。
#        → 待機中のトークン消費は完全ゼロ（bridge/watcherはNode番人でトークン不使用）。【既定・必須】
# poll : 受付係が30秒ごとにLINE確認＋各社員5分Cron監視。即応性は上がるが待機中も常時消費。【非推奨・使わない】
#
# ※poll→push に切り替えると install.sh が leader-poll の常駐(plist)を unload＋削除する。
#   Mac再起動後に古い leaderpoll が残っていないか必ず確認：
#     launchctl list | grep leaderpoll   （何も出なければOK）
MODE="push"

# --- ブリッジ／監視のパラメータ ---
PORT=18789           # LINEブリッジの待受ポート
POLL_MS=5000         # 見張り役のポーリング間隔（ミリ秒・task.md監視。ファイル確認のみでトークンは消費しない）
MAX_CONCURRENT=3     # 同時にspawnする最大claude数
THRESHOLD_MIN=60     # 死活監視：タスク滞留の警告しきい値（分）

# --- スリープ防止（常時起動の必須設定・実機の無反応事故の主因）---
# true にすると install.sh が caffeinate を launchd 常駐（com.lineaioffice.caffeinate）で登録し、
# Mac がスリープしてAI社員・トンネルごと止まるのを防ぐ（Mac再起動後も自動復帰）。
# 常時起動オフィス（専用Mac mini等）では true 推奨。ノートPC等で切りたい時のみ false。
PREVENT_SLEEP="true"

# --- ログイン切れ検知（無反応事故のもう一つの主因への対策）---
# Claude Code のログイン(OAuth)が切れると、LINE着信で起動したAI社員が401で即死し
# **全社員が完全に沈黙**する（Claude自身は認証切れなので「切れた」とすら言えない）。
# 対策は2段構え（どちらも Claude認証に依存しない Node/bash 層で動く）：
#   ① bridge が spawn ログの401を検知→送信者へ「少々お待ちください」＋オーナーへ「/loginして」を自動通知
#   ② authwatch が定期的に認証の生死を最小プロンプトで点検→切れていたら先回りでオーナーに通知
# AUTH_WATCH=true で ② を launchd 常駐（既定6時間おき・1回あたり極小消費）。
# トークンを1滴も使いたくない場合のみ false（①の事後検知は常に有効）。
AUTH_WATCH="true"

# --- 信頼性しきい値（"沈黙する穴"の恒久対策・既定で妥当。通常は触らなくてよい）---
# SPAWN_TIMEOUT_MIN : 起動したAI社員がこの分数応答しなければハングとみなし停止（ロック解放＝1社員の永久沈黙を防ぐ）
# STALE_DOING_MIN   : クラッシュ等で残った task_doing.md をこの分数超で自動再キュー（再起動でも直らない恒久停止を防ぐ）
# MAX_TASK_RETRY    : 同一タスクの自動再試行の上限（超えたら task_failed.md へ退避＋オーナー通知＝無限リトライ防止）
# MAPPING_REFRESH_MIN: bridgeがアカウント対応表を再取得する間隔（API一時不調からの自動復帰・新チャネル反映）
# LOG_MAX_MB        : logs/*.log がこのサイズ超で末尾を残し切り詰め（長期運用のディスク逼迫を防ぐ）
SPAWN_TIMEOUT_MIN=8
STALE_DOING_MIN=10
MAX_TASK_RETRY=2
MAPPING_REFRESH_MIN=10
LOG_MAX_MB=5

# --- LINE / MCP ---
# OWNER_FRIEND_ID はオーナーのfriendId。★死活/ログイン切れアラートのLINE通知先にもなる（重要）。
OWNER_FRIEND_ID="owner-line-ai-office"   # オーナーのfriendId
MCP_NAME="line-harness"                  # MCPサーバ名

# --- Cloudflared トンネル自動復帰（LINE着信をMacのbridgeへ届ける"土管"）---
# 経路：LINE → Cloudflare Worker(line-harness) → cloudflaredトンネル → Macのbridge。
# このうち cloudflaredトンネルが Mac再起動で落ちると「LINEに送っても無反応」になる（既知の弱点）。
# TUNNEL_CMD を設定すると install.sh が com.lineaioffice.tunnel を keepalive+RunAtLoad で常駐登録し、
# Mac再起動やトンネル落ちでも launchd が自動で復活させる（＝無反応の恒久対策）。
#
# ★必ず「安定・固定URLのトンネル」を指定すること（起動毎にURLが変わる方式は不可。
#   URLが変わるとLINE→bridgeの転送先ごと破綻する）。
#   ▼推奨（ドメイン購入不要・実機採用済み）: ngrok の無料固定ドメイン
#       TUNNEL_CMD="ngrok http --url=https://<xxxxx>.ngrok-free.dev 18789"
#       （新しい ngrok は --url を使う。--domain は非推奨）
#       取得: ngrok.com 登録 → Domains で固定ドメイン発行 → authtoken を
#             `ngrok config add-authtoken <token>` で保存（詳細は RUNBOOK §D）
#   ▼別解（独自ドメインをCloudflareに持っている場合）: cloudflared 名前付きトンネル
#       TUNNEL_CMD="cloudflared tunnel run my-office"
# 空のままなら従来どおりトンネルは常駐登録しない（手動運用）。
TUNNEL_CMD=""

# --- メンバー定義 ---
# 書式:  "<dir>:<表示名>:<role-template.md>"
#   <dir>             : members/ 配下のフォルダ名
#   <表示名>          : LINE/ログ上の日本語表示名
#   <role-template.md>: roles/ 図書館内のテンプレファイル名
#
# 顧客の業種に合わせて、この配列を増減・差し替えするだけで構成が変わる。
# 先頭は必ず leader（コア必須）。
MEMBERS=(
  "member-leader:リーダー:leader.md"
  "member-lp:LP担当:lp.md"
  "member-designer:デザイナー:designer.md"
  "member-writer:ライター:writer.md"
  "member-video:動画制作:video.md"
  "member-sns:SNS担当:sns.md"
  "member-researcher:リサーチャー:researcher.md"
  "member-analyst:アナリスト:analyst.md"
)
