<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Lucent 工程ボード リール</title><style>
  /* Lucent（@lucent_autoparts）「みんなの工程ボード」体験版のリール 1080×1920（9:16）の重ね用画面
     render-koutei.cjs が .layer を1枚ずつ背景透明の PNG に書き出し、ffmpeg で元動画（koutei-demo.mp4）と重ねる
     ⚠️シリーズ（lights.html・buy2.html）と同じ型：暗い地＋Anton の英字（オレンジは PHONE. の1語だけ）＋ZKG 700 の日本語＋署名
     ⚠️こちらで足す文字に絵文字は入れない
     ⚠️インスタの画面とかぶらない：上200pxに文字なし／y>1520 に字幕・大事な文字なし／右130px（y>1000）に字幕なし
     フォントは fonts/ に今回の文字だけ切り出して置く（bash fetch-fonts.sh koutei-reel.html）

     ■ 配置（y座標）
       0〜200      ：何も置かない（インスタの上の表示）
       214〜500    ：見出し WHITEBOARD / ON EVERY PHONE.・日本語1行・注記（右上）
       528〜1606   ：元動画（1074×2200 を0.49倍＝526×1078、x=277）。角丸の穴＋細い枠でスマホの画面に見せる
                      元動画の中身の位置：アプリ名 528〜594／先回り通知 594〜869／工程の列とカード 876〜1307／
                      AIの吹き出し 1307〜1460／入力欄 約1471〜1513／注意書き 約1537〜1577
       594〜874    ：字幕の帯（元動画の「先回り通知」の上に重ねる＝カードの移動と入力欄は隠さない）
       左の余白    ：署名 LUCENT / SAITAMA, JAPAN（縦書き・小さく、x150・y900〜1440）
       1520〜1920  ：字幕・大事な文字なし（キャプション・アカウント名が重なる） */
  @font-face{font-family:'ZKG';font-weight:700;src:url('fonts/zkg-700-koutei-reel.ttf');}
  @font-face{font-family:'Anton';src:url('fonts/anton-koutei-reel.ttf');}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  /* 書き出しは背景透明（omitBackground）なので html/body には色を付けない。ブラウザで見るときは .layer の市松模様で透明が分かる */
  html,body{background:transparent;}
  .layer{width:1080px;height:1920px;position:relative;overflow:hidden;margin:0 auto 30px;color:#fff;}
  .layer.chk{background:repeating-conic-gradient(#3a3a3a 0 25%,#2c2c2c 0 50%) 0 0/40px 40px;}
  body.render .layer.chk{background:none;}

  /* ===== 地（.bg）：SVG で暗い地と枠を描き、元動画が見える所だけ穴を開ける ===== */
  .bg svg{position:absolute;inset:0;}

  /* ===== 見出し（ずっと出す） ===== */
  .head{position:absolute;left:66px;right:66px;top:214px;}
  .en{font-family:'Anton',sans-serif;text-transform:uppercase;line-height:.9;font-size:118px;letter-spacing:.005em;white-space:nowrap;}
  .en .c{color:#ff6a13;}
  .jp{font-family:'ZKG',sans-serif;font-weight:700;font-size:36px;margin-top:16px;letter-spacing:.04em;}
  /* 注記：WHITEBOARD の右の空き（1行目の右端）に小さく */
  .note{position:absolute;right:0;top:26px;font-family:'ZKG',sans-serif;font-weight:700;font-size:24px;letter-spacing:.06em;
    color:rgba(255,255,255,.82);border:2px solid rgba(255,255,255,.4);border-radius:6px;padding:7px 14px 8px;}
  /* 署名：元動画の左の余白に縦書き（シリーズの「上に線・両端に LUCENT と SAITAMA, JAPAN」を縦にしたもの） */
  .sign{position:absolute;left:150px;top:900px;height:540px;writing-mode:vertical-rl;display:flex;justify-content:space-between;
    font-family:'Anton',sans-serif;font-size:24px;letter-spacing:.2em;color:rgba(255,255,255,.62);
    border-left:2px solid rgba(255,255,255,.28);padding-left:14px;}

  /* ===== 字幕（ZKG 700・大きく）：y596〜866 の帯の中で上下中央 ===== */
  .band{position:absolute;left:66px;right:66px;top:594px;height:280px;display:flex;align-items:center;justify-content:center;}
  .cap{font-family:'ZKG',sans-serif;font-weight:700;text-align:center;}
  /* ふつうの字幕：暗い板に白文字 */
  .cap.say{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;
    background:#121212;border:2px solid rgba(255,255,255,.16);border-radius:22px;
    font-size:60px;line-height:1.42;letter-spacing:.03em;}
  /* 打った言葉：白地の吹き出し（しっぽは下＝入力欄の方向） */
  .cap.board{width:100%;height:100%;display:flex;justify-content:center;align-items:center;padding-bottom:14px;
    background:#121212;border:2px solid rgba(255,255,255,.16);border-radius:22px;}
  .cap.typed{position:relative;background:#fff;color:#141414;border-radius:30px;padding:26px 54px 30px;
    font-size:60px;line-height:1.38;letter-spacing:.02em;}
  .cap.typed::after{content:'';position:absolute;left:50%;bottom:-24px;margin-left:-22px;border:22px solid transparent;border-bottom:0;border-top:26px solid #fff;}
  /* 工程が動いた字幕：〈移動元〉は控えめ、→ は大きく、〈移動先〉だけオレンジ。板の縁もオレンジで「動いた」を示す */
  .cap.move{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;
    background:#121212;border:3px solid #ff6a13;border-radius:22px;}
  .move .row{font-size:76px;line-height:1.2;letter-spacing:.01em;white-space:nowrap;display:flex;align-items:center;}
  .move .from{color:rgba(255,255,255,.72);}
  .move .arw{display:block;width:104px;height:60px;margin:0 14px 0 4px;}
  .move .to{color:#ff6a13;}
  .move .sub{font-size:46px;line-height:1.3;margin-top:18px;letter-spacing:.04em;}

  /* ===== カバー（1080×1920）：6.5秒のコマを暗く敷き、文字は中央の3:4（y240〜1680）に収める ===== */
  .cover{background:#111;}
  .cover .photo{position:absolute;inset:0;background:url('koutei-reel-layers/cover-frame.png') center 0/cover no-repeat;filter:saturate(.8) blur(2px);}
  /* 暗くする：元の画面は白っぽいので強めに沈め、文字の来る下側ほど濃く（文字の裏の吹き出し・カードが透けないように）。
     ぼかしは2pxだけ（工程ボードの画面だと分かる程度に残す） */
  .cover .shade{position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(10,10,10,.80) 0%,rgba(10,10,10,.84) 40%,rgba(10,10,10,.94) 54%,rgba(10,10,10,.96) 100%);}
  .cover .txt{position:absolute;left:66px;right:66px;bottom:290px;}
  .cover .tag{display:inline-block;font-family:'ZKG',sans-serif;font-weight:700;font-size:30px;letter-spacing:.1em;
    border:2px solid rgba(255,255,255,.6);border-radius:6px;padding:8px 18px 10px;margin-bottom:34px;}
  .cover .en{font-size:144px;}
  .cover .jp{font-size:40px;margin-top:30px;}
  .cover .sign2{display:flex;justify-content:space-between;margin-top:40px;padding-top:20px;font-family:'Anton',sans-serif;
    border-top:2px solid rgba(255,255,255,.5);font-size:26px;letter-spacing:.18em;color:rgba(255,255,255,.85);}
</style></head><body>

<!-- 地：暗い地＋スマホの枠。元動画の画面（x277〜803, y528〜1606）より3px内側を角丸28pxで透明に抜く -->
<div class="layer chk bg" id="bg">
  <svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="g" cx="50%" cy="56%" r="70%">
        <stop offset="0" stop-color="#1d1d1d"/><stop offset="1" stop-color="#0c0c0c"/>
      </radialGradient>
    </defs>
    <!-- 地（穴あき） -->
    <path fill="url(#g)" fill-rule="evenodd" d="M0 0H1080V1920H0Z M308 531H772A28 28 0 0 1 800 559V1575A28 28 0 0 1 772 1603H308A28 28 0 0 1 280 1575V559A28 28 0 0 1 308 531Z"/>
    <!-- スマホの縁（幅12pxの黒い枠＋細い明るい線） -->
    <path fill="#1a1a1a" fill-rule="evenodd" d="M308 517H772A42 42 0 0 1 814 559V1575A42 42 0 0 1 772 1617H308A42 42 0 0 1 266 1575V559A42 42 0 0 1 308 517Z M308 531H772A28 28 0 0 1 800 559V1575A28 28 0 0 1 772 1603H308A28 28 0 0 1 280 1575V559A28 28 0 0 1 308 531Z"/>
    <path fill="none" stroke="rgba(255,255,255,.26)" stroke-width="2" d="M308 516H772A43 43 0 0 1 815 559V1575A43 43 0 0 1 772 1618H308A43 43 0 0 1 265 1575V559A43 43 0 0 1 308 516Z"/>
  </svg>
</div>

<!-- 見出し・日本語・注記・署名（ずっと出す） -->
<div class="layer chk" id="title">
  <div class="head">
    <div class="en"><span>Whiteboard</span><br><span class="l2">On every <span class="c">phone.</span></span></div>
    <div class="jp">ホワイトボードを、全員のスマホに。</div>
    <div class="note">体験版｜名前・車は架空</div>
  </div>
  <div class="sign"><span>LUCENT</span><span>SAITAMA, JAPAN</span></div>
</div>

<!-- 字幕1：0.0〜2.5 -->
<div class="layer chk" id="cap1"><div class="band"><div class="cap say">外から工程を見るには、<br>帰るか、電話か。</div></div></div>
<!-- 字幕2：2.5〜6.0（打った言葉） -->
<div class="layer chk" id="cap2"><div class="band"><div class="cap board"><div class="cap typed">「田中さんのハイエース<br>塗装上がった」</div></div></div></div>
<!-- 字幕3：6.0〜9.0（工程が動いた） -->
<div class="layer chk" id="cap3"><div class="band"><div class="cap move">
  <div class="row"><span class="from">〈塗装〉</span><svg class="arw" viewBox="0 0 104 60" aria-label="→"><path fill="#fff" d="M0 22H66V0L104 30L66 60V38H0Z"/></svg><span class="to">〈組付け〉</span></div>
  <div class="sub">車が次の工程へ。</div></div></div></div>
<!-- 字幕4：9.0〜13.0（打った言葉） -->
<div class="layer chk" id="cap4"><div class="band"><div class="cap board"><div class="cap typed">「佐藤さんのフィット<br>板金終わった」</div></div></div></div>
<!-- 字幕5：13.0〜14.5（工程が動いた） -->
<div class="layer chk" id="cap5"><div class="band"><div class="cap move">
  <div class="row"><span class="from">〈板金〉</span><svg class="arw" viewBox="0 0 104 60" aria-label="→"><path fill="#fff" d="M0 22H66V0L104 30L66 60V38H0Z"/></svg><span class="to">〈塗装〉</span></div></div></div></div>
<!-- 字幕6：14.5〜17.0 -->
<div class="layer chk" id="cap6"><div class="band"><div class="cap say">体験版は、DMで<br>「ボード」と一言。</div></div></div>

<!-- カバー -->
<div class="layer cover" id="cover"><div class="photo"></div><div class="shade"></div>
  <div class="txt">
    <div class="tag">体験版</div>
    <div class="en"><span>Whiteboard</span><br><span class="l2">On every <span class="c">phone.</span></span></div>
    <div class="jp">ホワイトボードを、全員のスマホに。</div>
    <div class="sign2"><span>LUCENT</span><span>SAITAMA, JAPAN</span></div>
  </div>
</div>

</body></html>
