<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Lucent 部品買取サムネ</title><style>
  /* Lucent（@lucent_autoparts）部品買取の告知サムネ 1080×1350（4:5）
     ⚠️買うのは「部品のみ」。車（事故車・廃車）の買取は絶対に書かない
     ⚠️AI感を消す：実物写真を全面に敷く／絵文字なし／中央寄せなし／のっぺり背景なし
     実写を入れるとき：同じフォルダに buy-photo.jpg を置き、.slide に class="real" を足す */
  *{margin:0;padding:0;box-sizing:border-box;font-family:'IPAPGothic','IPAGothic',sans-serif;-webkit-font-smoothing:antialiased;}
  body{background:#111;}
  :root{--amber:#ffb21e;}

  .slide{width:1080px;height:1350px;position:relative;overflow:hidden;color:#fff;margin:0 auto 26px;background:#0c0c0c;}

  /* 写真レイヤー（今はプレースホルダ：暗い倉庫の棚） */
  .photo{position:absolute;inset:0;
    background:
      radial-gradient(900px 700px at 78% 8%,rgba(255,196,110,.28),transparent 60%),
      repeating-linear-gradient(180deg,transparent 0 212px,rgba(0,0,0,.55) 212px 226px,rgba(160,160,160,.22) 226px 230px),
      repeating-linear-gradient(90deg,transparent 0 250px,rgba(20,20,20,.9) 250px 268px,rgba(130,130,130,.25) 268px 272px),
      linear-gradient(160deg,#3a3835 0%,#23221f 45%,#121110 100%);}
  /* 棚に並んだ部品っぽいシルエット（プレースホルダ用） */
  .photo::before{content:"";position:absolute;inset:0;opacity:.55;
    background:
      radial-gradient(60px 44px at 130px 180px,#6d6a64,transparent 70%),
      radial-gradient(80px 50px at 390px 170px,#57544f,transparent 70%),
      radial-gradient(70px 46px at 640px 176px,#7a766f,transparent 70%),
      radial-gradient(90px 52px at 900px 172px,#5f5b55,transparent 70%),
      radial-gradient(70px 48px at 200px 400px,#625f59,transparent 70%),
      radial-gradient(90px 50px at 520px 396px,#77736c,transparent 70%),
      radial-gradient(70px 46px at 800px 404px,#58554f,transparent 70%),
      radial-gradient(80px 48px at 110px 620px,#6a665f,transparent 70%),
      radial-gradient(70px 44px at 450px 616px,#56534d,transparent 70%),
      radial-gradient(90px 52px at 760px 622px,#6f6b64,transparent 70%);}
  /* 粒子感（写真っぽいザラつき） */
  .photo::after{content:"";position:absolute;inset:0;opacity:.18;mix-blend-mode:overlay;
    background:repeating-radial-gradient(circle at 30% 40%,#fff 0 1px,transparent 1px 3px);}
  /* 実写に差し替えたとき */
  .slide.real .photo{background:url('buy-photo.jpg') center/cover no-repeat;}
  .slide.real .photo::before,.slide.real .photo::after{display:none;}

  /* 文字を読ませる黒グラデ（下から） */
  .shade{position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 38%,rgba(0,0,0,.78) 62%,rgba(0,0,0,.94) 100%);}

  .in{position:absolute;inset:0;padding:70px 72px 64px;display:flex;flex-direction:column;}

  /* 上：ブランド帯 */
  .top{display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:18px;}
  .brand i{display:block;width:44px;height:8px;background:var(--amber);}
  .brand b{font-size:34px;letter-spacing:.42em;font-weight:bold;}
  .where{font-size:26px;letter-spacing:.12em;color:#e8e2d6;border:2px solid rgba(255,255,255,.55);padding:8px 18px;}

  /* 下：コピー */
  .copy{margin-top:auto;}
  .kicker{display:inline-block;font-size:34px;font-weight:bold;color:var(--amber);letter-spacing:.04em;margin-bottom:26px;
    border-left:8px solid var(--amber);padding-left:18px;}
  h1{font-size:122px;line-height:1.16;font-weight:bold;letter-spacing:-.02em;
    -webkit-text-stroke:3px #fff;text-shadow:0 6px 30px rgba(0,0,0,.6);}
  h1 .slab{display:inline-block;margin-top:14px;background:var(--amber);color:#111;
    -webkit-text-stroke:3px #111;text-shadow:none;padding:4px 22px 10px;}
  .sub{font-size:36px;line-height:1.6;color:#f1ece2;margin-top:34px;font-weight:bold;}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:40px;padding-top:26px;
    border-top:2px solid rgba(255,255,255,.35);font-size:28px;color:#d9d3c7;letter-spacing:.06em;}
  .foot b{color:#fff;}
</style></head><body>

<div class="slide"><div class="photo"></div><div class="shade"></div><div class="in">
  <div class="top">
    <div class="brand"><i></i><b>LUCENT</b></div>
    <div class="where">熊谷｜中古部品</div>
  </div>
  <div class="copy">
    <div class="kicker">連休明け、棚の整理ついでに。</div>
    <h1>使わない部品、<br><span class="slab">買い取ります。</span></h1>
    <div class="sub">外し取り・余剰在庫・処分予定でも。<br>まずは写真を送ってください。</div>
    <div class="foot"><span><b>DM</b> または プロフィールのリンクから</span><span>@lucent_autoparts</span></div>
  </div>
</div></div>

</body></html>
